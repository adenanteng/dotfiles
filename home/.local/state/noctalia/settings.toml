# Sanitized desktop preferences; assets and private state are not included.
config_version = 14

[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.15999999642372131
    contact_shadow = false
    end = [
        "tray",
        "notifications",
        "clipboard",
        "notes",
        "mpvpaper",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center"
    ]
    font_family = "Plus Jakarta Sans"
    padding = 12
    radius = 20
    shadow = false
    start = [ "launcher", "workspaces", "media" ]
    thickness = 36
    widget_spacing = 8

[battery]
warning_threshold = 20

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 56.0
    box_width = 1920.0
    cx = 960.0
    cy = 1172.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.40000000000000002
        background_padding = 0
        background_radius = 20
        bands = 72
        centered = false
        color_1 = "#ECECEC"
        color_2 = "#ECECEC"
        mirrored = true
        reversed = true
        show_when_idle = false

[dock]
background_opacity = 0.15999999642372131
cross_axis_padding = 8
enabled = true
icon_size = 32
item_spacing = 8
main_axis_padding = 16
radius = 20

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 120.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 822.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.20000000000000001
border = false
offset_x = 16
offset_y = 12

[osd]
background_opacity = 0.20000000000000001
border = false
offset_x = 16
offset_y = 12

[plugin_settings."noctalia/mpvpaper"]
picker_open_near_click = true

[plugin_settings."noctalia/notes"]
panel_open_near_click = true
panel_placement = "attached"

[plugins]
enabled = [ "noctalia/notes", "noctalia/mpvpaper" ]

[shell]
app_icon_color = "on_primary"
button_borders = false
clipboard_auto_paste = "off"
corner_radius_scale = 2.0
font_family = "Plus Jakarta Sans"
input_borders = false
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    clipboard_position = "auto"
    floating_layer = "top"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    shadow = false
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 45

    [shell.shadow]
    alpha = 0.12

[theme]
builtin = "Gruvbox"
community_palette = "ADW"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "antigravity", "opencode", "spicetify", "zen-browser", "telegram", "zed", "fastfetch" ]

[wallpaper]
enabled = false
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 60

[widget.brightness]
show_label = false

[widget.media]
anchor = true
hide_album_art = true
hide_when_no_media = true
title_scroll = "always"

[widget.mpvpaper]
glyph = "wallpaper-selector"
type = "noctalia/mpvpaper:mpvpaper"

[widget.notes]
anchor = true
type = "noctalia/notes:notes"

[widget.notifications]
hide_when_no_unread = true

[widget.volume]
show_label = false

[widget.workspaces]
pill_scale = 0.59999999999999998
show_labels = false
